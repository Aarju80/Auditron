<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Auditron — audit any public URL for HTTP status, load time, SEO basics, and image accessibility gaps.">
  <title>Auditron — URL Auditor</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <h1>Auditron</h1>
    <p class="subtitle">Paste a URL to audit its status, load time, SEO basics, and accessibility gaps.</p>

    <form id="audit-form" novalidate>
      <div class="input-wrap">
        <input
          type="url"
          id="url-input"
          name="url"
          placeholder="https://example.com"
          autocomplete="off"
          spellcheck="false"
          aria-label="URL to audit"
          required
        >
        <button type="button" id="clear-btn" class="clear-btn hidden" aria-label="Clear URL" title="Clear">✕</button>
      </div>
      <button type="submit" id="submit-btn">Audit</button>
    </form>

    <div id="loading" class="loading hidden" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span>Auditing…</span>
    </div>

    <div id="error" class="error-box hidden" role="alert" aria-live="assertive"></div>

    <div id="report" class="hidden" role="region" aria-label="Audit results" aria-live="polite"></div>
  </main>

  <footer>
    <a href="https://digitalheroesco.com" target="_blank" rel="noopener noreferrer">
      Built for Digital Heroes Training Task · digitalheroesco.com
    </a>
  </footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>

</html>
