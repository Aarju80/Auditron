[pytest]
testpaths = tests
log_cli = true
log_cli_level = WARNING
# anyio-based async tests: run against both asyncio and trio backends
anyio_mode = auto
# Suppress library-level deprecation advisory about httpx + starlette TestClient
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore::PendingDeprecationWarning:starlette.*
